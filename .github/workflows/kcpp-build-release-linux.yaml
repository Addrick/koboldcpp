name: Koboldcpp Linux

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''

  # fork-only (DP-326): build and deploy on push to main or deploy.
  # Must never be carried onto feat/* or into an upstream PR.
  push:
    branches: [main, deploy]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  KCPP_CUDA: nocuda
  ARCHES_CU12: 0

jobs:
  linux:
    runs-on: [self-hosted, Linux, ct100]
    permissions: write-all
    steps:
      - name: Clone
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}"

      - name: Set Tcl/Tk Paths
        run: |
          echo "TCL_LIBRARY=$(find /usr/lib/ -name 'tcl8*' | head -n 1)" >> $GITHUB_ENV
          echo "TK_LIBRARY=$(find /usr/lib/ -name 'tk8*' | head -n 1)" >> $GITHUB_ENV

      - name: Build
        id: make_build
        run: |
          ./koboldcpp.sh dist

      - name: Rename file before upload
        run: |
          if [ -f dist/koboldcpp-linux-x64-cuda1210 ]; then
            mv dist/koboldcpp-linux-x64-cuda1210 dist/koboldcpp-linux-x64
          fi

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: kcpp_linux_binary
          path: dist/

      - name: Upload to GitHub Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dist/koboldcpp-linux-x64 ]; then
            gh release upload rolling dist/koboldcpp-linux-x64 --clobber --repo ${{ github.repository }}
          fi
          gh release upload rolling dist/koboldcpp-linux-x64-nocuda --clobber --repo ${{ github.repository }}

  # JOB 2: Deploy to CT101 (:5001) via self-hosted runner
  # Runs on push to main/deploy, or manual workflow_dispatch.
  deploy:
    needs: linux
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_hash == '')
    runs-on: [self-hosted, Linux, ct101]
    steps:
      - name: Fetch and stage rolling binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /opt/kcpp-ops/fetch-rolling.py --force

      - name: Cut over and bounce :5001
        run: /opt/kcpp-ops/cutover.sh --apply staged

      - name: Verify driver VRAM residency
        run: |
          vram=$(cat /sys/class/drm/card1/device/mem_info_vram_used)
          gtt=$(cat /sys/class/drm/card1/device/mem_info_gtt_used)
          echo "Driver VRAM: $((vram / 1048576)) MiB, GTT: $((gtt / 1048576)) MiB"
          if [ "$gtt" -gt 4294967296 ]; then
            echo "ERROR: High GTT usage detected ($((gtt / 1048576)) MiB > 4096 MiB) — rolling back!" >&2
            /opt/kcpp-ops/cutover.sh --rollback
            exit 1
          fi

      - name: Report deployment status
        run: /opt/kcpp-ops/cutover.sh --status

